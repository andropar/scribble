name: Windows and Linux app

on:
  push:
    branches: [windows-linux-port]
    paths: ["python/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows · Python 3.12", os: windows-latest, python: "3.12" }
          - { name: "Windows · Python 3.9", os: windows-2022, python: "3.9" }
          - name: "Linux X11, two displays, no compositor · Python 3.12"
            os: ubuntu-24.04
            python: "3.12"
            compositor: "0"
            screen: 3840x1080x24
            monitors: "1920x1080+0+0 1920x1080+1920+0"
            expect_displays: "0,0,1920,1080@1;1920,0,1920,1080@1"
          - { name: "Linux X11 with compositor · Python 3.9", os: ubuntu-22.04, python: "3.9", compositor: "1" }
          - name: "Linux X11, two displays, second at 200% · Python 3.12"
            os: ubuntu-24.04
            python: "3.12"
            compositor: "1"
            desktop_only: true
            screen: 3840x1080x24
            monitors: "1920x1080+0+0 1920x1080+1920+0"
            screen_scale_factors: "1;2"
            expect_displays: "0,0,1920,1080@1;1920,0,1920,1080@2"
          - name: "Linux X11 at 150% · Python 3.12"
            os: ubuntu-24.04
            python: "3.12"
            compositor: "1"
            desktop_only: true
            screen: 2880x1620x24
            scale_factor: "1.5"
    defaults:
      run:
        working-directory: python
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Test folders
        run: |
          echo "VOICE_ANNOTATE_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
          echo "VOICE_ANNOTATE_TEST_HOME=$RUNNER_TEMP/va-home" >> "$GITHUB_ENV"
          echo "VOICE_ANNOTATE_SPEECH=$RUNNER_TEMP/speech.wav" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils x11-xserver-utils openbox picom xclip espeak-ng \
            libportaudio2 pulseaudio pulseaudio-utils libasound2-plugins \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 fonts-dejavu-core \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-xfixes0

      - name: Install the app
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        if: matrix.python == '3.12' && runner.os == 'Linux'
        run: |
          python -m pip install black==26.10.1
          python -m black --check src tests

      - name: Headless tests (core, pipeline, app state machine)
        if: ${{ !matrix.desktop_only }}
        run: python -m pytest -q -o faulthandler_timeout=300

      - name: Speech sample (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && !matrix.desktop_only }}
        run: espeak-ng -v en-us -s 140 -w "$VOICE_ANNOTATE_SPEECH" "This button is broken. Please move the legend below the chart."

      - name: Speech sample (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile($env:VOICE_ANNOTATE_SPEECH)
          $voice.Speak("This button is broken. Please move the legend below the chart.")
          $voice.Dispose()

      - name: Cache the Whisper test model
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/va-home/models
          key: whisper-tiny-en-v1

      - name: Transcription tests (real Whisper model)
        if: ${{ !cancelled() && !matrix.desktop_only }}
        env:
          VOICE_ANNOTATE_TEST_MODEL: "1"
        run: python -m pytest -q -m model -o faulthandler_timeout=600

      - name: Virtual microphone (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > ~/.asoundrc
          pulseaudio --start --exit-idle-time=-1
          pactl unload-module module-suspend-on-idle || true
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
          pactl set-default-source virtual.monitor
          python -c "import sounddevice as sd; print(sd.query_devices())"
          # Does capture work at all here, outside the app? (ALSA directly, then PortAudio.)
          timeout 10 arecord -q -D default -f S16_LE -r 16000 -c 1 -d 2 "$RUNNER_TEMP/arecord.wav" || true
          ls -l "$RUNNER_TEMP/arecord.wav" || true
          python -c "
          import time, sounddevice as sd
          t = time.time(); a = sd.rec(32000, samplerate=16000, channels=1, blocking=True)
          print('sounddevice blocking record: %d frames in %.2fs' % (len(a), time.time() - t))
          "

      - name: Virtual sound card (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@v1

      - name: Desktop tests (Linux, Xvfb)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 15
        env:
          COMPOSITOR: ${{ matrix.compositor }}
          SCREEN: ${{ matrix.screen }}
          MONITORS: ${{ matrix.monitors }}
          QT_SCALE_FACTOR: ${{ matrix.scale_factor }}
          QT_SCREEN_SCALE_FACTORS: ${{ matrix.screen_scale_factors }}
          VOICE_ANNOTATE_EXPECT_DISPLAYS: ${{ matrix.expect_displays }}
          VOICE_ANNOTATE_LOOPBACK: "1"
        run: |
          # An unset matrix value arrives as an empty variable; Qt must not see those.
          for name in SCREEN MONITORS QT_SCALE_FACTOR QT_SCREEN_SCALE_FACTORS VOICE_ANNOTATE_EXPECT_DISPLAYS; do
            [ -n "${!name}" ] || unset "$name"
          done
          tests/integration/run_x11.sh -o faulthandler_timeout=240

      - name: Desktop tests (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 15
        run: python -m pytest --desktop tests/integration -v -o faulthandler_timeout=240

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ strategy.job-index }}-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore
