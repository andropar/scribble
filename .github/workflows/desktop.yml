name: Windows and Linux app

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["python/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows · Python 3.12", os: windows-latest, python: "3.12" }
          - { name: "Windows · Python 3.9", os: windows-2022, python: "3.9" }
          - { name: "Linux X11 · Python 3.12", os: ubuntu-24.04, python: "3.12", compositor: "0" }
          - { name: "Linux X11 with compositor · Python 3.9", os: ubuntu-22.04, python: "3.9", compositor: "1" }
          - name: "Linux X11 at 150% · Python 3.12"
            os: ubuntu-24.04
            python: "3.12"
            compositor: "1"
            desktop_only: true
            screen: 2880x1620x24
            scale_factor: "1.5"
    defaults:
      run:
        working-directory: python
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Test folders
        run: |
          echo "SCRIBBLE_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
          echo "SCRIBBLE_TEST_HOME=$RUNNER_TEMP/va-home" >> "$GITHUB_ENV"
          echo "SCRIBBLE_SPEECH=$RUNNER_TEMP/speech.wav" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils openbox picom xclip espeak-ng \
            libportaudio2 pulseaudio pulseaudio-utils libasound2-plugins \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 fonts-dejavu-core \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-xfixes0

      - name: Install the app
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        if: matrix.python == '3.12' && runner.os == 'Linux'
        run: |
          python -m pip install black==26.10.1
          python -m black --check src tests

      - name: Headless tests (core, pipeline, app state machine)
        if: ${{ !matrix.desktop_only }}
        run: python -m pytest -q -o faulthandler_timeout=300

      - name: Speech sample (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && !matrix.desktop_only }}
        run: espeak-ng -v en-us -s 140 -w "$SCRIBBLE_SPEECH" "This button is broken. Please move the legend below the chart."

      - name: Speech sample (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile($env:SCRIBBLE_SPEECH)
          $voice.Speak("This button is broken. Please move the legend below the chart.")
          $voice.Dispose()

      - name: Cache the Whisper test model
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/va-home/models
          key: whisper-tiny-en-v1

      - name: Transcription tests (real Whisper model)
        if: ${{ !cancelled() && !matrix.desktop_only }}
        env:
          SCRIBBLE_TEST_MODEL: "1"
        run: python -m pytest -q -m model -o faulthandler_timeout=600

      - name: Virtual microphone (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > ~/.asoundrc
          pulseaudio --start --exit-idle-time=-1
          pactl unload-module module-suspend-on-idle || true
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
          pactl set-default-source virtual.monitor
          python -c "import sounddevice as sd; print(sd.query_devices())"

      - name: Virtual sound card (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@v1

      - name: Desktop tests (Linux, Xvfb)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 15
        env:
          COMPOSITOR: ${{ matrix.compositor }}
          SCREEN: ${{ matrix.screen }}
          QT_SCALE_FACTOR: ${{ matrix.scale_factor }}
          SCRIBBLE_LOOPBACK: "1"
        run: |
          # An unset matrix value arrives as an empty variable; Qt must not see those.
          for name in SCREEN QT_SCALE_FACTOR; do
            [ -n "${!name}" ] || unset "$name"
          done
          tests/integration/run_x11.sh -o faulthandler_timeout=240

      - name: Desktop tests (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 15
        run: python -m pytest --desktop tests/integration -v -o faulthandler_timeout=240

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ strategy.job-index }}-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore

  package:
    name: Download · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    defaults:
      run:
        working-directory: python
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb espeak-ng libportaudio2 libegl1 libgl1 libfontconfig1 libdbus-1-3 fonts-dejavu-core \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-xfixes0

      - name: Build
        run: |
          python -m pip install -e . pyinstaller
          python packaging/build.py
          du -sh dist/scribble
          ls -l dist

      - name: Speech sample (Linux)
        if: runner.os == 'Linux'
        run: espeak-ng -v en-us -s 140 -w "$RUNNER_TEMP/speech.wav" "This button is broken. Please move the legend below the chart."

      - name: Speech sample (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav")
          $voice.Speak("This button is broken. Please move the legend below the chart.")
          $voice.Dispose()

      - name: Try the build (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/smoke_test.py dist/scribble "$RUNNER_TEMP/speech.wav"

      - name: Try the build (Windows)
        if: runner.os == 'Windows'
        run: python packaging/smoke_test.py dist/scribble "$RUNNER_TEMP/speech.wav"

      - name: Install from a wheel, as users do
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheel"
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          (cd "$RUNNER_TEMP/wheel" && "$bin/python" -m pip install scribble-*.whl)
          "$bin/scribble" --version
          ls "$bin" | grep scribble-gui
          QT_QPA_PLATFORM=offscreen "$bin/scribble" --render-demo "$RUNNER_TEMP/demo.png"
          # The icon travels inside the package.
          "$bin/python" -c "import os, scribble; p = os.path.join(os.path.dirname(scribble.__file__), 'resources', 'icon.png'); assert os.path.isfile(p), p"

      - name: Try the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist\scribble-windows-setup.exe"
          $app = "$env:LOCALAPPDATA\Programs\Scribble"
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"

          # An update over 0.4.0, when the app was called voice-annotate and started at sign-in.
          $old = "$env:RUNNER_TEMP\voice-annotate-setup.exe"
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/v0.4.0/voice-annotate-windows-setup.exe" -OutFile $old
          $p = Start-Process $old -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the 0.4.0 installer exited with $($p.ExitCode)" }
          $oldApp = "$env:LOCALAPPDATA\Programs\voice-annotate"
          if (-not (Test-Path "$oldApp\voice-annotate.exe")) { throw "0.4.0 did not install" }
          Set-ItemProperty $runKey -Name 'voice-annotate' -Value "`"$oldApp\voice-annotate.exe`""
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the update exited with $($p.ExitCode)" }
          & "$app\scribble-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the updated app does not run" }
          if (Test-Path $oldApp) { throw "the update left the voice-annotate folder behind" }
          if (Test-Path "$menu\voice-annotate") { throw "the update left the old Start menu entry behind" }
          $run = Get-ItemProperty $runKey
          if ($run.'voice-annotate') { throw "the update left the old autostart entry" }
          if ($run.'Scribble' -notlike "*scribble.exe*") { throw "the update lost the start at sign-in" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstalling the update exited with $($u.ExitCode)" }
          Start-Sleep 3

          # A fresh installation.
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=autostart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          & "$app\scribble-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed app does not run" }
          if (-not (Test-Path "$menu\Scribble\Scribble.lnk")) { throw "no Start menu entry" }
          $run = Get-ItemProperty $runKey
          if ($run.'Scribble' -notlike "*scribble.exe*") { throw "autostart entry missing" }
          python packaging/smoke_test.py $app "$env:RUNNER_TEMP\speech.wav"
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }
          Start-Sleep 3
          if (Test-Path "$app\scribble.exe") { throw "uninstall left the app behind" }
          $run = Get-ItemProperty $runKey
          if ($run.'Scribble') { throw "uninstall left the autostart entry" }

      - name: Try the installer (Linux)
        if: runner.os == 'Linux'
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          mkdir "$RUNNER_TEMP/unpacked" && tar -xzf dist/scribble-linux-x86_64.tar.gz -C "$RUNNER_TEMP/unpacked"

          # An update over 0.4.0, when the app was called voice-annotate and started at login.
          mkdir "$RUNNER_TEMP/old"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.4.0/voice-annotate-linux-x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP/old"
          "$RUNNER_TEMP/old/voice-annotate/install.sh"
          test -x "$HOME/.local/bin/voice-annotate"
          mkdir -p "$HOME/.config/autostart"
          printf '[Desktop Entry]\nType=Application\nName=voice-annotate\nExec=%s\n' "$HOME/.local/opt/voice-annotate/voice-annotate" > "$HOME/.config/autostart/voice-annotate.desktop"
          "$RUNNER_TEMP/unpacked/scribble/install.sh"
          "$HOME/.local/bin/scribble-cli" --version
          test ! -e "$HOME/.local/opt/voice-annotate" && test ! -e "$HOME/.local/bin/voice-annotate"
          test ! -e "$HOME/.local/share/applications/voice-annotate.desktop" && test ! -e "$HOME/.config/autostart/voice-annotate.desktop"
          grep -q "Exec=$HOME/.local/opt/scribble/scribble" "$HOME/.config/autostart/scribble.desktop"
          "$HOME/.local/opt/scribble/install.sh" --uninstall
          test ! -e "$HOME/.config/autostart/scribble.desktop"

          # A fresh installation.
          "$RUNNER_TEMP/unpacked/scribble/install.sh"
          "$HOME/.local/bin/scribble-cli" --version
          grep -q "Exec=$HOME/.local/opt/scribble/scribble" "$HOME/.local/share/applications/scribble.desktop"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/scribble.png"
          xvfb-run -a python packaging/smoke_test.py "$HOME/.local/opt/scribble"
          ls "$HOME/.local/opt/scribble/_internal" | grep -i -E "portaudio|xcb-cursor" || echo "(portaudio and xcb-cursor are not bundled)"
          "$HOME/.local/opt/scribble/install.sh" --uninstall
          test ! -e "$HOME/.local/opt/scribble" && test ! -e "$HOME/.local/bin/scribble"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: scribble-${{ runner.os }}
          path: |
            python/dist/scribble-windows-setup.exe
            python/dist/scribble-windows-x64.zip
            python/dist/scribble-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # Each system builds its own files; the patterns drop the ones that are not here.
          files=(dist/scribble-windows-setup.ex[e] dist/scribble-windows-x64.zi[p] dist/scribble-linux-x86_64.tar.g[z])
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
